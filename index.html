<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>النظام البنكي الخاص - علاء الدين</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body{
      font-family: "Segoe UI", Tahoma, sans-serif;
      background: linear-gradient(135deg,#141e30,#243b55);
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      margin:0;
      padding:20px 0;
      direction: rtl;
      box-sizing: border-box;
    }

    .card{
      background:white;
      padding:30px;
      width:400px;
      border-radius:20px;
      box-shadow:0 20px 40px rgba(0,0,0,0.3);
      animation: fadeIn 0.4s ease-in-out;
    }

    h2, h3{
      text-align:center;
      margin-bottom:20px;
      color:#243b55;
    }

    input{
      width:100%;
      padding:14px;
      margin:10px 0;
      border-radius:12px;
      border:1px solid #ddd;
      font-size:14px;
      background:#f9fafc;
      transition: all 0.25s ease;
      box-sizing:border-box;
    }

    input:focus{
      border-color:#2a5298;
      background:white;
      outline:none;
      box-shadow:0 0 0 3px rgba(42,82,152,0.15);
      transform:translateY(-1px);
    }

    input::placeholder{
      color:#999;
      font-size:13px;
    }

    input:hover{
      border-color:#aaa;
    }

    #amount{
      font-weight:bold;
      letter-spacing:0.5px;
    }

    button{
      width:100%;
      padding:12px;
      margin-top:10px;
      border:none;
      border-radius:10px;
      font-weight:bold;
      cursor:pointer;
      transition:0.2s;
      font-size:14px;
    }

    #registerBtn{ background:#1e88e5; color:white; }
    #loginBtn{ background:#43a047; color:white; }
    #depositBtn{ background:#2ecc71; color:white; }
    #withdrawBtn{ background:#e74c3c; color:white; }

    button:hover{
      transform:translateY(-2px);
      opacity:0.9;
    }

    button:disabled{
      background:gray;
      cursor:not-allowed;
    }

    .balance{
      font-size:24px;
      text-align:center;
      margin:15px 0;
      font-weight:bold;
      color:#243b55;
    }

    .loading{
      text-align:center;
      display:none;
      margin-top:10px;
      font-size:14px;
      color:#243b55;
    }

    .account-box{
      display:flex;
      align-items:center;
      gap:12px;
      background:linear-gradient(135deg,#243b55,#141e30);
      padding:15px;
      border-radius:15px;
      color:white;
      margin-bottom:15px;
      box-shadow:0 8px 20px rgba(0,0,0,0.25);
    }

    .avatar-circle{
      width:45px;
      height:45px;
      border-radius:50%;
      background:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
    }

    .account-text{
      display:flex;
      flex-direction:column;
    }

    @keyframes fadeIn{
      from{opacity:0; transform:translateY(10px);}
      to{opacity:1; transform:translateY(0);}
    }
    
  /* ================= شبكة الأزرار المربعة ================= */
  .grid-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-top: 15px;
  }

  /* تنسيق الأزرار المربعة */
  .btn-custom {
    width: 100%;
    height: 85px;
    padding: 6px;
    margin: 0;
    border: none;
    border-radius: 14px;
    color: white;
    font-weight: bold;
    font-size: 11px;
    cursor: pointer;
    transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.12);
    box-sizing: border-box;
    text-align: center;
  }

  .btn-custom span.icon {
    font-size: 22px;
  }

  .btn-custom:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.2);
  }

  /* اللون الموحد المعتمد لجميع الخدمات البنكية (أزرق داكن كلاسيكي) */
  .btn-service { 
    background: linear-gradient(135deg, #1e3c72, #2a5298); 
  }

  /* ألوان الإجراءات السفلية المصاحبة */
  .btn-pdf { background: linear-gradient(135deg, #6f42c1, #a88be0); }
  .btn-logout { background: linear-gradient(135deg, #dc3545, #ff6b6b); }
</style>
  
</head>

<body>

<!-- ================= تسجيل الدخول ================= -->
<div class="card" id="authCard">

  <div id="loginView">
    <h2>تسجيل الدخول</h2>
    <input type="text" id="username" placeholder="اسم الحساب (انجليزي)">
    <input type="password" id="password" placeholder="كلمة المرور">
    <button id="loginBtn" onclick="login()">تسجيل الدخول</button>

    <p style="text-align:center;margin-top:15px;">
      ليس لديك حساب؟
      <a href="#" onclick="showRegister()">إنشاء حساب</a>
    </p>
  </div>

  <div id="registerView" style="display:none;">
    <h2>إنشاء حساب جديد</h2>
    <input type="text" id="usernameReg" placeholder="اسم الحساب (انجليزي)">
    <input type="password" id="passwordReg" placeholder="كلمة المرور">
    <input type="text" id="fullName" placeholder="الاسم الكامل">
    <input type="text" id="accountName" placeholder="اسم الحساب البنكي">
    <button id="registerBtn" onclick="register()">إنشاء حساب</button>

    <p style="text-align:center;margin-top:15px;">
      لديك حساب بالفعل؟
      <a href="#" onclick="showLogin()">تسجيل الدخول</a>
    </p>
  </div>

  <div class="loading" id="authLoading">جاري المعالجة...</div>
</div>


<!-- ================= البنك ================= -->
<div class="card" id="bankCard" style="display:none">

 <h2>حسابي البنكي</h2>

<div id="accountInfo" class="account-box">
  <div class="avatar-circle">👤</div>
  <div>
    <div id="welcomeName"></div>
    <div id="accountNameDisplay"></div>
  </div>
</div>

<div class="balance">
  الرصيد: <span id="balance">0</span>
</div>

<!-- الشاشة الرئيسية -->
<div id="mainScreen">
  <h3>الخدمات والعمليات</h3>
  <div class="grid-container">
    <button class="btn-custom btn-service" onclick="openDeposit()">
      <span class="icon">💳</span>
      <span>العمليات</span>
    </button>

    <button class="btn-custom btn-service" onclick="comingSoon('خدمة السحب')">
      <span class="icon">💸</span>
      <span>سحب</span>
    </button>
    
    <button class="btn-custom btn-service" onclick="showStatement()">
      <span class="icon">📄</span>
      <span>كشف الحساب</span>
    </button>

    <button class="btn-custom btn-service" onclick="comingSoon('شراء الكهرباء')">
      <span class="icon">⚡</span>
      <span>الكهرباء</span>
    </button>

    <button class="btn-custom btn-service" onclick="comingSoon('تحويل الرصيد')">
      <span class="icon">📲</span>
      <span>تحويل الرصيد</span>
    </button>

    <button class="btn-custom btn-service" onclick="comingSoon('الخدمات الحكومية')">
      <span class="icon">🏛️</span>
      <span>خدمات حكومية</span>
    </button>

    <button class="btn-custom btn-service" onclick="comingSoon('التجارة الإلكترونية')">
      <span class="icon">🛒</span>
      <span>التجارة الإلكترونية</span>
    </button>

    <button class="btn-custom btn-service" onclick="openKunozStore()">
      <span class="icon">💎</span>
      <span>متجر كنوز الغرة</span>
    </button>

    <button class="btn-custom btn-service" onclick="comingSoon('خدمات أخرى')">
      <span class="icon">✨</span>
      <span>خدمات أخرى</span>
    </button>
  </div>
</div>

<!-- شاشة الإيداع -->
<div id="depositScreen" style="display:none">
  <h3>العمليات</h3>
  <input type="number" id="amount" placeholder="المبلغ">
  <input type="text" id="description" placeholder="بيان العملية">
  <button id="depositBtn" onclick="deposit()">إيداع</button>
  <button id="withdrawBtn" onclick="withdraw()">سحب</button>
  <button onclick="closeDeposit()">رجوع</button>
</div>

<!-- كشف الحساب -->
<div id="statementScreen" style="display:none">
  <h3>كشف الحساب</h3>

  <input type="date" id="fromDate">
  <input type="date" id="toDate">

  <button onclick="filterTransactions()">بحث</button>

  <div style="max-height:300px; overflow-y:auto; margin-top:10px; border:1px solid #ddd; border-radius:10px;">
    <table border="1" style="width:100%; border-collapse:collapse; text-align:center;">
      <thead style="position:sticky; top:0; background:#f1f1f1; z-index:1;">
        <tr>
          <th>التاريخ</th>
          <th>النوع</th>
          <th>المبلغ</th>
          <th>الوصف</th>
          <th>تعديل</th>
          <th>حذف</th>
        </tr>
      </thead>
      <tbody id="transactionsBody"></tbody>
    </table>
  </div>

  <button onclick="closeStatement()">رجوع</button>
</div>

  <!-- أزرار الإجراءات السفلية -->
  <div style="display: flex; gap: 12px; justify-content: center; margin-top:20px;">
    <button class="btn-custom btn-pdf" style="width: 48%;" onclick="downloadPDF()">
      <span class="icon">📥</span>
      <span>تحميل PDF</span>
    </button> 
    <button class="btn-custom btn-logout" style="width: 48%;" onclick="logout()">
      <span class="icon">🚪</span>
      <span>خروج</span>
    </button>
  </div>

  <!-- منطقة الطباعة -->
  <div id="printArea" style="display:none; direction:rtl; font-family:Arial; width:190mm; padding:15mm; box-sizing:border-box;">
    <div style="text-align:center; margin-bottom:10mm;">
      <h2 style="margin:0;">🏦 بنك ABM</h2>
      <div style="text-align: right; font-weight: bold;">
        <p id="pdfFullName" style="color: #007bff;"></p>
        <p id="pdfAccountName" style="color: #28a745;"></p>
        <p id="pdfBalance" style="color: #0056b3;"></p>
      </div>
      <hr>
    </div>
    <table border="1" style="width:100%; border-collapse:collapse; text-align:center;">
      <thead>
        <tr>
          <th>التاريخ</th>
          <th>النوع</th>
          <th>المبلغ</th>
          <th>الوصف</th>
        </tr>
      </thead>
      <tbody id="pdfTransactionsBody"></tbody>
    </table>
     <br><br>
    <div style="text-align: left; color: #0056b3; font-family: sans-serif; padding-left: 10px;">
      <h2 style="margin: 0; font-weight: 200; display: inline-block;">علاء الدين ادم احمد</h2>
      <br>
      <h2 style="margin: 0; font-weight: 200; font-size: 1.2em; display: inline-block;">المدير العام</h2>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>
  // دالة لإظهار رسالة "قريباً" للخدمات غير المفعلة
  function comingSoon(serviceName) {
    alert("خدمة (" + serviceName + ") ستكون متاحة قريباً!");
  }

  // دالة التوجيه لمتجر كنوز الغرة
  function openKunozStore() {
    window.open("https://kunoz-algurrah.github.io/e/store.html", "_blank");
  }
</script>

<script src="bank.js"></script>

</body>
</html>
