<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تعديل بيانات الحساب</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f3f4f6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #111827;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        input:disabled {
            background: #f3f4f6;
            color: #6b7280;
        }

        button {
            width: 100%;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .save-btn {
            background: #2563eb;
            color: white;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .save-btn:disabled {
            background: #93c5fd;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            display: none;
        }

        .success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        .error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .loading {
            text-align: center;
            color: #6b7280;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>تعديل بيانات الحساب</h2>

        <div id="loading" class="loading">
            جاري جلب بيانات الحساب...
        </div>

        <form id="accountForm" style="display:none;">

            <!-- ID -->
            <div class="form-group">
                <label>رقم الحساب</label>

                <input
                    type="text"
                    id="id"
                    disabled
                >
            </div>

            <!-- User ID -->
            <div class="form-group">
                <label>معرف المستخدم</label>

                <input
                    type="text"
                    id="user_id"
                    disabled
                >
            </div>

            <!-- Full Name -->
            <div class="form-group">
                <label for="full_name">
                    الاسم الكامل
                </label>

                <input
                    type="text"
                    id="full_name"
                    required
                >
            </div>

            <!-- Account Name -->
            <div class="form-group">
                <label for="account_name">
                    اسم الحساب
                </label>

                <input
                    type="text"
                    id="account_name"
                    required
                >
            </div>

            <!-- Balance -->
            <div class="form-group">
                <label for="balance">
                    الرصيد
                </label>

                <input
                    type="number"
                    id="balance"
                    step="0.01"
                    required
                >
            </div>

            <button
                type="submit"
                class="save-btn"
                id="saveBtn"
            >
                حفظ التعديلات
            </button>

        </form>

        <div id="message" class="message"></div>

    </div>

</div>


<script>

    // ==========================================
    // بيانات مشروع Supabase
    // ==========================================

    const SUPABASE_URL =
        "https://rahqhfowbphaipiadlkh.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_WAA4kMqzeM2_S6Mxi9t9kg_hbLIjbh9";


    // إنشاء اتصال Supabase
    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // ==========================================
    // المتغير الذي يحتوي ID السجل
    // ==========================================

    let accountId = null;


    // ==========================================
    // جلب بيانات الحساب
    // ==========================================

    async function loadAccount() {

        try {

            /*
             * هنا نحدد الحساب المطلوب.
             *
             * مثال:
             * page.html?id=1
             *
             * سيجلب الحساب الذي id = 1
             */

            const params =
                new URLSearchParams(window.location.search);

            accountId = params.get("id");


            if (!accountId) {

                showMessage(
                    "لم يتم تحديد رقم الحساب. افتح الصفحة بهذا الشكل: ?id=1",
                    "error"
                );

                document.getElementById("loading").style.display = "none";

                return;
            }


            // جلب السجل من جدول accounts
            const { data, error } =
                await supabaseClient
                    .from("accounts")
                    .select(`
                        id,
                        user_id,
                        balance,
                        created_at,
                        full_name,
                        account_name
                    `)
                    .eq("id", accountId)
                    .single();


            if (error) {

                console.error(error);

                showMessage(
                    "حدث خطأ أثناء جلب البيانات: " + error.message,
                    "error"
                );

                document.getElementById("loading").style.display = "none";

                return;
            }


            // ==========================================
            // تعبئة النموذج بالبيانات الحقيقية
            // ==========================================

            document.getElementById("id").value =
                data.id ?? "";

            document.getElementById("user_id").value =
                data.user_id ?? "";

            document.getElementById("full_name").value =
                data.full_name ?? "";

            document.getElementById("account_name").value =
                data.account_name ?? "";

            document.getElementById("balance").value =
                data.balance ?? "";


            // إخفاء التحميل
            document.getElementById("loading").style.display =
                "none";


            // إظهار النموذج
            document.getElementById("accountForm").style.display =
                "block";

        }

        catch (error) {

            console.error(error);

            showMessage(
                "حدث خطأ غير متوقع: " + error.message,
                "error"
            );

        }

    }


    // ==========================================
    // حفظ التعديلات
    // ==========================================

    document
        .getElementById("accountForm")
        .addEventListener("submit", async function(event) {

            event.preventDefault();


            const saveBtn =
                document.getElementById("saveBtn");


            saveBtn.disabled = true;

            saveBtn.textContent =
                "جاري الحفظ...";


            // البيانات الجديدة
            const updatedData = {

                full_name:
                    document.getElementById("full_name").value.trim(),

                account_name:
                    document.getElementById("account_name").value.trim(),

                balance:
                    Number(
                        document.getElementById("balance").value
                    )

            };


            try {

                /*
                 * UPDATE accounts
                 * WHERE id = accountId
                 */

                const { data, error } =
                    await supabaseClient
                        .from("accounts")
                        .update(updatedData)
                        .eq("id", accountId)
                        .select();


                if (error) {

                    console.error(error);

                    showMessage(
                        "فشل حفظ التعديلات: " + error.message,
                        "error"
                    );

                    return;
                }


                console.log(
                    "تم تحديث البيانات:",
                    data
                );


                showMessage(
                    "تم تحديث بيانات الحساب بنجاح ✅",
                    "success"
                );

            }

            catch (error) {

                console.error(error);

                showMessage(
                    "حدث خطأ: " + error.message,
                    "error"
                );

            }

            finally {

                saveBtn.disabled = false;

                saveBtn.textContent =
                    "حفظ التعديلات";

            }

        });


    // ==========================================
    // الرسائل
    // ==========================================

    function showMessage(text, type) {

        const message =
            document.getElementById("message");

        message.textContent = text;

        message.className =
            "message " + type;

    }


    // ==========================================
    // تشغيل جلب البيانات
    // ==========================================

    loadAccount();

</script>

</body>

</html>
