<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>إدارة المستخدمين</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 26px;
        }

        .subtitle {
            color: #6b7280;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            overflow-x: auto;
            box-shadow: 0 5px 20px rgba(0,0,0,.06);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 750px;
        }

        th {
            background: #2563eb;
            color: white;
            padding: 15px;
            text-align: right;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f9fafb;
        }

        .edit-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .edit-btn:hover {
            background: #1d4ed8;
        }

        .balance {
            font-weight: bold;
            color: #059669;
        }

        .loading,
        .empty {
            padding: 40px;
            text-align: center;
            color: #6b7280;
        }

        .error {
            margin-top: 15px;
            padding: 15px;
            background: #fee2e2;
            color: #991b1b;
            border-radius: 10px;
        }

        /* نافذة التعديل */

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            width: 100%;
            max-width: 500px;
            background: white;
            border-radius: 18px;
            padding: 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #6b7280;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #2563eb;
        }

        input[readonly] {
            background: #f3f4f6;
            color: #6b7280;
        }

        .save-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 9px;
            background: #16a34a;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #15803d;
        }

        .save-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            text-align: center;
        }

        #message.success {
            display: block;
            background: #dcfce7;
            color: #166534;
        }

        #message.error {
            display: block;
            background: #fee2e2;
            color: #991b1b;
        }

        .refresh-btn {
            margin-top: 15px;
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            background: #111827;
            color: white;
            cursor: pointer;
        }
    </style>

</head>

<body>

<div class="container">

    <div class="header">

        <h1>إدارة المستخدمين</h1>

        <div class="subtitle">
            المستخدمون المسجلون في جدول accounts
        </div>

        <button class="refresh-btn" onclick="loadAccounts()">
            تحديث البيانات
        </button>

    </div>


    <div class="table-container">

        <div id="loading" class="loading">
            جاري جلب بيانات المستخدمين...
        </div>

        <table id="accountsTable" style="display:none;">

            <thead>

                <tr>
                    <th>ID</th>
                    <th>معرف المستخدم</th>
                    <th>الاسم الكامل</th>
                    <th>اسم الحساب</th>
                    <th>الرصيد</th>
                    <th>تاريخ الإنشاء</th>
                    <th>الإجراء</th>
                </tr>

            </thead>

            <tbody id="accountsBody"></tbody>

        </table>

        <div id="empty" class="empty" style="display:none;">
            لا توجد بيانات في جدول accounts.
        </div>

        <div id="errorBox"></div>

    </div>

</div>


<!-- نافذة تعديل المستخدم -->

<div id="editModal" class="modal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>تعديل بيانات الحساب</h2>

            <button
                class="close"
                onclick="closeModal()">
                ×
            </button>

        </div>


        <form id="editForm">

            <div class="form-group">

                <label>ID</label>

                <input
                    type="text"
                    id="editId"
                    readonly
                >

            </div>


            <div class="form-group">

                <label>User ID</label>

                <input
                    type="text"
                    id="editUserId"
                    readonly
                >

            </div>


            <div class="form-group">

                <label for="editFullName">
                    الاسم الكامل
                </label>

                <input
                    type="text"
                    id="editFullName"
                    required
                >

            </div>


            <div class="form-group">

                <label for="editAccountName">
                    اسم الحساب
                </label>

                <input
                    type="text"
                    id="editAccountName"
                    required
                >

            </div>


            <div class="form-group">

                <label for="editBalance">
                    الرصيد
                </label>

                <input
                    type="number"
                    id="editBalance"
                    step="0.01"
                    required
                >

            </div>


            <button
                type="submit"
                class="save-btn"
                id="saveBtn">

                حفظ التعديلات

            </button>


            <div id="message"></div>

        </form>

    </div>

</div>


<script>

    // =============================================
    // Supabase
    // =============================================

    const SUPABASE_URL =
        "https://rahqhfowbphaipiadlkh.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_WAA4kMqzeM2_S6Mxi9t9kg_hbLIjbh9";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    // =============================================
    // جلب جميع المستخدمين من accounts
    // =============================================

    async function loadAccounts() {

        const loading =
            document.getElementById("loading");

        const table =
            document.getElementById("accountsTable");

        const body =
            document.getElementById("accountsBody");

        const empty =
            document.getElementById("empty");

        const errorBox =
            document.getElementById("errorBox");


        loading.style.display = "block";
        table.style.display = "none";
        empty.style.display = "none";

        body.innerHTML = "";
        errorBox.innerHTML = "";


        try {

            const { data, error } =
                await supabaseClient

                    .from("accounts")

                    .select(`
                        id,
                        user_id,
                        balance,
                        created_at,
                        full_name,
                        account_name
                    `)

                    .order(
                        "id",
                        {
                            ascending: true
                        }
                    );


            if (error) {

                console.error(
                    "Supabase Error:",
                    error
                );

                throw error;
            }


            console.log(
                "بيانات accounts:",
                data
            );


            loading.style.display = "none";


            if (!data || data.length === 0) {

                empty.style.display = "block";

                return;
            }


            // =============================================
            // عرض البيانات
            // =============================================

            data.forEach(account => {

                const row =
                    document.createElement("tr");


                const createdAt =
                    account.created_at
                        ? new Date(
                            account.created_at
                          ).toLocaleString(
                              "ar"
                          )
                        : "-";


                row.innerHTML = `

                    <td>
                        ${escapeHtml(account.id)}
                    </td>

                    <td>
                        ${escapeHtml(account.user_id)}
                    </td>

                    <td>
                        ${escapeHtml(
                            account.full_name || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            account.account_name || "-"
                        )}
                    </td>

                    <td class="balance">
                        ${escapeHtml(
                            account.balance ?? "0"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(createdAt)}
                    </td>

                    <td>

                        <button
                            class="edit-btn"
                            onclick='openEditModal(
                                ${JSON.stringify(account)}
                            )'>

                            تعديل

                        </button>

                    </td>

                `;


                body.appendChild(row);

            });


            table.style.display = "table";

        }

        catch (error) {

            loading.style.display = "none";

            errorBox.innerHTML = `

                <div class="error">

                    <strong>
                        حدث خطأ أثناء جلب البيانات
                    </strong>

                    <br><br>

                    ${escapeHtml(
                        error.message ||
                        "خطأ غير معروف"
                    )}

                </div>

            `;

        }

    }


    // =============================================
    // فتح نافذة التعديل
    // =============================================

    function openEditModal(account) {

        document.getElementById("editId").value =
            account.id ?? "";

        document.getElementById("editUserId").value =
            account.user_id ?? "";

        document.getElementById("editFullName").value =
            account.full_name ?? "";

        document.getElementById("editAccountName").value =
            account.account_name ?? "";

        document.getElementById("editBalance").value =
            account.balance ?? "";


        document
            .getElementById("editModal")
            .classList.add("show");


        document.getElementById("message").className = "";

        document.getElementById("message").style.display =
            "none";

    }


    // =============================================
    // إغلاق النافذة
    // =============================================

    function closeModal() {

        document
            .getElementById("editModal")
            .classList.remove("show");

    }


    // =============================================
    // حفظ التعديلات
    // =============================================

    document
        .getElementById("editForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const id =
                    document.getElementById(
                        "editId"
                    ).value;


                const fullName =
                    document.getElementById(
                        "editFullName"
                    ).value.trim();


                const accountName =
                    document.getElementById(
                        "editAccountName"
                    ).value.trim();


                const balance =
                    Number(
                        document.getElementById(
                            "editBalance"
                        ).value
                    );


                if (!id) {

                    showMessage(
                        "لم يتم تحديد الحساب.",
                        "error"
                    );

                    return;
                }


                if (!fullName) {

                    showMessage(
                        "الرجاء إدخال الاسم الكامل.",
                        "error"
                    );

                    return;
                }


                if (!accountName) {

                    showMessage(
                        "الرجاء إدخال اسم الحساب.",
                        "error"
                    );

                    return;
                }


                if (isNaN(balance)) {

                    showMessage(
                        "الرصيد غير صحيح.",
                        "error"
                    );

                    return;
                }


                const saveBtn =
                    document.getElementById(
                        "saveBtn"
                    );


                saveBtn.disabled = true;

                saveBtn.textContent =
                    "جاري الحفظ...";


                try {

                    const { data, error } =

                        await supabaseClient

                            .from("accounts")

                            .update({

                                full_name:
                                    fullName,

                                account_name:
                                    accountName,

                                balance:
                                    balance

                            })

                            .eq(
                                "id",
                                id
                            )

                            .select();


                    if (error) {

                        console.error(
                            "Update Error:",
                            error
                        );

                        throw error;
                    }


                    console.log(
                        "تم تحديث:",
                        data
                    );


                    showMessage(
                        "تم حفظ التعديلات بنجاح ✓",
                        "success"
                    );


                    // تحديث الجدول
                    await loadAccounts();


                    setTimeout(
                        closeModal,
                        1000
                    );

                }

                catch (error) {

                    console.error(error);

                    showMessage(
                        "فشل حفظ التعديلات: " +
                        error.message,
                        "error"
                    );

                }

                finally {

                    saveBtn.disabled = false;

                    saveBtn.textContent =
                        "حفظ التعديلات";

                }

            }
        );


    // =============================================
    // عرض الرسائل
    // =============================================

    function showMessage(
        text,
        type
    ) {

        const message =
            document.getElementById(
                "message"
            );


        message.textContent = text;

        message.className =
            type;

        message.style.display =
            "block";

    }


    // =============================================
    // حماية النصوص المعروضة
    // =============================================

    function escapeHtml(value) {

        if (value === null ||
            value === undefined) {

            return "";

        }


        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    // =============================================
    // تشغيل الصفحة
    // =============================================

    loadAccounts();

</script>

</body>

</html>
