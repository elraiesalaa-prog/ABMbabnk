name: Keep Bank Supabase Active

on:
  schedule:
    # يعمل يومياً لضمان عدم الخمول
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Real Query to Bank Supabase
        run: |
          curl -i -X GET "https://rahqhfowbphaipiadlkh.supabase.co/rest/v1/transactions?limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
